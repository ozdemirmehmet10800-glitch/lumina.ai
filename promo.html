<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina AI — Resmi Tanıtım Videosu | Geliştirici: Berkay Özdemir</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #05070e;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    .promo-header {
      text-align: center;
      margin-bottom: 1.25rem;
      max-width: 800px;
    }

    .promo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #818cf8;
      margin-bottom: 0.75rem;
    }

    .promo-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .promo-sub {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    .developer-tag {
      color: #22d3ee;
      font-weight: 700;
    }

    /* Video Canvas Wrapper */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 1060px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px -10px rgba(99, 102, 241, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    #video-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Video Overlay Controls */
    .video-overlay-ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
    }

    .overlay-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(11, 17, 32, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .rec-indicator.active {
      opacity: 1;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.2; }
    }

    .start-screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 22, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease;
      cursor: pointer;
    }

    .start-screen-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .big-play-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 1.25rem;
    }

    .big-play-btn:hover {
      transform: scale(1.1);
    }

    /* Actions Bar */
    .controls-bar {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .btn-action {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary-glow {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      color: #fff;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-primary-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .status-toast {
      margin-top: 0.85rem;
      font-size: 0.88rem;
      color: #94a3b8;
      min-height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="promo-header">
    <div class="promo-badge">🎬 Resmi Sinematik Tanıtım Fragmanı</div>
    <h1 class="promo-title">Lumina AI Tanıtım Videosu</h1>
    <p class="promo-sub">Proje Mimarı & Geliştirici: <span class="developer-tag">Berkay Özdemir</span></p>
  </header>

  <!-- Video Canvas Box -->
  <div class="video-container" id="video-box">
    <canvas id="video-canvas" width="1920" height="1080"></canvas>

    <div class="video-overlay-ui">
      <div class="overlay-top">
        <div class="brand-pill">
          <span style="color:#06b6d4;">✨</span> Lumina AI Cinema 4K
        </div>
        <div class="rec-indicator" id="rec-indicator">
          <div class="rec-dot"></div>
          <span id="rec-label">REC • HD</span>
        </div>
      </div>
    </div>

    <!-- Start Overlay -->
    <div class="start-screen-overlay" id="start-overlay">
      <div class="big-play-btn">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="#fff"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </div>
      <h2 style="font-family:'Outfit'; font-size:1.6rem; font-weight:700; margin-bottom:0.35rem;">Tanıtım Videosunu Başlat</h2>
      <p style="color:#94a3b8; font-size:0.9rem;">Sinematik ses efektleri ve 60 FPS görsel animasyon ile</p>
    </div>
  </div>

  <!-- Bottom Buttons -->
  <div class="controls-bar">
    <button class="btn-action btn-primary-glow" id="btn-record-download">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Videoyu Render Et & İndir (MP4/WebM)</span>
    </button>

    <button class="btn-action btn-outline" id="btn-replay">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      <span>Yeniden Oynat</span>
    </button>

    <a href="index.html" class="btn-action btn-outline">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Uygulamaya Dön</span>
    </a>
  </div>

  <div class="status-toast" id="status-toast"></div>

  <!-- LOGO ASSET PRELOAD -->
  <img id="logo-img" src="assets/logo.jpg" style="display:none;" alt="Lumina Logo">

  <script>
    // ==========================================
    // LUMINA AI - CINEMATIC VIDEO GENERATOR
    // Developer Credit: Berkay Özdemir
    // ==========================================

    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('start-overlay');
    const recIndicator = document.getElementById('rec-indicator');
    const recLabel = document.getElementById('rec-label');
    const btnRecordDownload = document.getElementById('btn-record-download');
    const btnReplay = document.getElementById('btn-replay');
    const statusToast = document.getElementById('status-toast');
    const logoImg = document.getElementById('logo-img');

    // Video Duration & Timeline (20 Seconds Total)
    const DURATION = 20.0;
    let startTime = null;
    let isPlaying = false;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let audioContext = null;
    let audioDestination = null;

    // Starfield & Particle System
    const particles = [];
    for (let i = 0; i < 180; i++) {
      particles.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        size: Math.random() * 3 + 1,
        speedX: (Math.random() - 0.5) * 0.8,
        speedY: (Math.random() - 0.5) * 0.8,
        alpha: Math.random() * 0.8 + 0.2,
        color: ['#6366f1', '#06b6d4', '#818cf8', '#a855f7', '#ffffff'][Math.floor(Math.random() * 5)]
      });
    }

    // ==========================================
    // CINEMATIC WEB AUDIO SYNTHESIZER
    // ==========================================
    function initAudio() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
        audioDestination = audioContext.createMediaStreamDestination();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function playCinematicTrailerMusic() {
      initAudio();
      const now = audioContext.currentTime;

      function connectNode(node) {
        node.connect(audioContext.destination);
        if (audioDestination) node.connect(audioDestination);
      }

      // 1. Deep Sub Bass Impact (0s)
      playSubBass(now, 55, 3.5);

      // 2. Rising Synths (3s -> 4s)
      playRiser(now + 2.5, 4.0);

      // 3. Huge Drop Impact (4s)
      setTimeout(() => {
        const t = audioContext.currentTime;
        playSubBass(t, 45, 4.5);
        playChimeChord(t);
      }, 4000);

      // 4. Feature Rhythms (8s, 10s, 12s)
      [8, 10, 12].forEach((sec) => {
        setTimeout(() => {
          const t = audioContext.currentTime;
          playBeep(t, 880);
          playSubBass(t, 65, 1.2);
        }, sec * 1000);
      });

      // 5. Developer Spotlight Climax (14s)
      setTimeout(() => {
        const t = audioContext.currentTime;
        playMajesticFanfare(t);
        playSubBass(t, 40, 5.0);
      }, 14000);
    }

    function playSubBass(start, freq, dur) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      osc.frequency.exponentialRampToValueAtTime(30, start + dur);

      gain.gain.setValueAtTime(0.7, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);

      osc.connect(gain);
      gain.connect(audioContext.destination);
      if (audioDestination) gain.connect(audioDestination);

      osc.start(start);
      osc.stop(start + dur + 0.1);
    }

    function playRiser(start, dur) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, start);
      osc.frequency.exponentialRampToValueAtTime(800, start + dur);

      gain.gain.setValueAtTime(0.01, start);
      gain.gain.linearRampToValueAtTime(0.3, start + dur);
      gain.gain.setValueAtTime(0, start + dur + 0.05);

      osc.connect(gain);
      gain.connect(audioContext.destination);
      if (audioDestination) gain.connect(audioDestination);

      osc.start(start);
      osc.stop(start + dur + 0.1);
    }

    function playChimeChord(start) {
      [523.25, 659.25, 783.99, 1046.5].forEach(freq => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.2, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 3.0);

        osc.connect(gain);
        gain.connect(audioContext.destination);
        if (audioDestination) gain.connect(audioDestination);

        osc.start(start);
        osc.stop(start + 3.1);
      });
    }

    function playBeep(start, freq) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);

      gain.gain.setValueAtTime(0.25, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);

      osc.connect(gain);
      gain.connect(audioContext.destination);
      if (audioDestination) gain.connect(audioDestination);

      osc.start(start);
      osc.stop(start + 0.45);
    }

    function playMajesticFanfare(start) {
      [440, 554.37, 659.25, 880, 1108.73].forEach((f, idx) => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, start + idx * 0.08);

        gain.gain.setValueAtTime(0.3, start + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, start + idx * 0.08 + 3.5);

        osc.connect(gain);
        gain.connect(audioContext.destination);
        if (audioDestination) gain.connect(audioDestination);

        osc.start(start + idx * 0.08);
        osc.stop(start + idx * 0.08 + 3.6);
      });
    }

    // ==========================================
    // SCENE RENDERING PIPELINE (1080p 60FPS)
    // ==========================================
    function renderFrame(time) {
      const t = time; // 0 to 20 seconds

      // Background
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, 1920, 1080);

      // Render Dynamic Space Grid
      drawCyberGrid(t);

      // Render Floating Star Particles
      drawParticles(t);

      // --- SCENE 1: (0s - 3.8s) The Struggle / Chaos ---
      if (t < 3.8) {
        const alpha = Math.min(t / 0.8, 1) * Math.max(0, 1 - (t - 2.8) / 1.0);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';

        ctx.font = '600 34px "Outfit"';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('HER GÜN BİNLERCE DÜŞÜNCE. SAYISIZ GÖREV.', 960, 480);

        ctx.font = '800 64px "Outfit"';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('ZİHİNSEL DAĞINIKLIĞI VE ERTELEMEYİ BİTİRİN.', 960, 560);
        ctx.restore();
      }

      // --- SCENE 2: (3.8s - 8.2s) Lumina AI Reveal ---
      else if (t >= 3.8 && t < 8.2) {
        const localT = t - 3.8;
        const enterAlpha = Math.min(localT / 0.8, 1);
        const exitAlpha = Math.max(0, 1 - (localT - 3.4) / 1.0);
        const alpha = enterAlpha * (localT > 3.4 ? exitAlpha : 1);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';

        // Logo with pulse glow
        const scale = 1 + Math.sin(localT * 3) * 0.04;
        const logoSize = 180 * scale;
        if (logoImg.complete) {
          ctx.save();
          ctx.shadowColor = '#6366f1';
          ctx.shadowBlur = 50;
          ctx.drawImage(logoImg, 960 - logoSize / 2, 340 - logoSize / 2, logoSize, logoSize);
          ctx.restore();
        }

        ctx.font = '900 90px "Outfit"';
        const grad = ctx.createLinearGradient(600, 0, 1320, 0);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#818cf8');
        grad.addColorStop(1, '#06b6d4');
        ctx.fillStyle = grad;
        ctx.fillText('LUMINA AI', 960, 530);

        ctx.font = '600 36px "Plus Jakarta Sans"';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('YENİ NESİL AKILLI KİŞİSEL ÜRETKENLİK İSTASYONU', 960, 600);

        ctx.font = '500 24px "Plus Jakarta Sans"';
        ctx.fillStyle = '#64748b';
        ctx.fillText('Zamanınızı, zihninizi ve hedeflerinizi yapay zeka ile yönetin.', 960, 650);
        ctx.restore();
      }

      // --- SCENE 3: (8.2s - 13.5s) Core Features Showcase ---
      else if (t >= 8.2 && t < 13.5) {
        const localT = t - 8.2;
        const alpha = Math.min(localT / 0.6, 1) * Math.max(0, 1 - (localT - 4.5) / 0.8);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';

        ctx.font = '800 48px "Outfit"';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('HER ŞEY TEK BİR GÜÇLÜ İSTASYONDA', 960, 280);

        // 4 Feature Cards (Interactive Layout)
        const features = [
          { icon: '🤖', title: 'AI Görev Parçalama', desc: 'Büyük hedefleri 3 somut adıma böler', color: '#6366f1' },
          { icon: '🧠', title: '14Hz Alfa Beyin Dalgası', desc: 'Web Audio ile sentetik odak sesleri', color: '#06b6d4' },
          { icon: '📝', title: 'AI Not Özetleyici', desc: 'Düşüncelerden anında eylem planı', color: '#10b981' },
          { icon: '🎯', title: 'Derin Odak & Zen Modu', desc: 'Sıfır dikkat dağıtıcı tam ekran', color: '#f59e0b' }
        ];

        features.forEach((feat, idx) => {
          const x = 360 + idx * 300;
          const y = 480;
          const cardOffset = Math.sin(localT * 2 + idx) * 8;

          // Card Background
          ctx.save();
          ctx.fillStyle = 'rgba(18, 26, 47, 0.85)';
          ctx.strokeStyle = feat.color;
          ctx.lineWidth = 2;
          ctx.shadowColor = feat.color;
          ctx.shadowBlur = 20;

          roundRect(ctx, x - 130, y - 110 + cardOffset, 260, 240, 16, true, true);

          ctx.font = '54px sans-serif';
          ctx.fillText(feat.icon, x, y - 30 + cardOffset);

          ctx.font = '700 22px "Outfit"';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(feat.title, x, y + 35 + cardOffset);

          ctx.font = '400 15px "Plus Jakarta Sans"';
          ctx.fillStyle = '#94a3b8';
          wrapText(ctx, feat.desc, x, y + 70 + cardOffset, 220, 20);
          ctx.restore();
        });

        ctx.restore();
      }

      // --- SCENE 4: (13.5s - 18.0s) DEVELOPER SPOTLIGHT (BERKAY ÖZDEMİR) ---
      else if (t >= 13.5 && t < 18.0) {
        const localT = t - 13.5;
        const alpha = Math.min(localT / 0.7, 1) * Math.max(0, 1 - (localT - 3.7) / 0.8);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';

        // Developer Halo Glow
        const haloGrad = ctx.createRadialGradient(960, 520, 50, 960, 520, 480);
        haloGrad.addColorStop(0, 'rgba(6, 182, 212, 0.25)');
        haloGrad.addColorStop(0.5, 'rgba(99, 102, 241, 0.15)');
        haloGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = haloGrad;
        ctx.fillRect(0, 0, 1920, 1080);

        // Frame
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
        ctx.lineWidth = 2;
        roundRect(ctx, 460, 280, 1000, 500, 24, false, true);

        // Subtitle Top
        ctx.font = '700 24px "Outfit"';
        ctx.fillStyle = '#06b6d4';
        ctx.fillText('PROJE MİMARI & GELİŞTİRİCİ', 960, 390);

        // Big Developer Name
        ctx.font = '900 86px "Outfit"';
        const nameGrad = ctx.createLinearGradient(550, 0, 1370, 0);
        nameGrad.addColorStop(0, '#ffffff');
        nameGrad.addColorStop(0.5, '#38bdf8');
        nameGrad.addColorStop(1, '#818cf8');
        ctx.fillStyle = nameGrad;
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 40;
        ctx.fillText('BERKAY ÖZDEMİR', 960, 490);
        ctx.shadowBlur = 0;

        // Sub description
        ctx.font = '500 26px "Plus Jakarta Sans"';
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText('Teknolojiyi, Bilişsel Bilimi ve Yapay Zekayı Buluşturan Vizyon', 960, 570);

        ctx.font = '400 20px "Plus Jakarta Sans"';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Kişisel Verimlilikte Yeni Standart: Lumina AI Ekosistemi', 960, 630);

        // Verified Badge Icon
        ctx.fillStyle = '#10b981';
        ctx.font = '28px sans-serif';
        ctx.fillText('⚡ Modern Web & AI Architecture', 960, 690);

        ctx.restore();
      }

      // --- SCENE 5: (18.0s - 20.0s) GRAND FINALE ---
      else {
        const localT = t - 18.0;
        const alpha = Math.min(localT / 0.5, 1);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';

        ctx.font = '900 76px "Outfit"';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('ZİHNİNİZİ ÖZGÜRLEŞTİRİN.', 960, 460);

        ctx.font = '700 40px "Outfit"';
        ctx.fillStyle = '#22d3ee';
        ctx.fillText('LUMINA AI ŞİMDİ CEBİNİZDE', 960, 540);

        ctx.font = '500 22px "Plus Jakarta Sans"';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Geliştirici: Berkay Özdemir • 2026', 960, 620);
        ctx.restore();
      }
    }

    function drawCyberGrid(t) {
      ctx.save();
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.06)';
      ctx.lineWidth = 1;
      const offset = (t * 40) % 80;

      for (let x = 0; x < 1920; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1080);
        ctx.stroke();
      }
      for (let y = offset; y < 1080; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1920, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles(t) {
      ctx.save();
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.x < 0) p.x = 1920;
        if (p.x > 1920) p.x = 0;
        if (p.y < 0) p.y = 1080;
        if (p.y > 1080) p.y = 0;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // ==========================================
    // ANIMATION LOOP & RECORDER
    // ==========================================
    function startVideo(record = false) {
      initAudio();
      isPlaying = true;
      isRecording = record;
      startTime = performance.now();
      startOverlay.classList.add('hidden');
      statusToast.textContent = record ? '🎥 Video HD kalitede kaydediliyor, lütfen bekleyin...' : '▶️ Tanıtım videosu oynatılıyor...';

      if (record) {
        recIndicator.classList.add('active');
        recordedChunks = [];
        const canvasStream = canvas.captureStream(60);

        // Mix canvas video + synthesized Web Audio
        const combinedStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...audioDestination.stream.getAudioTracks()
        ]);

        const mime = MediaRecorder.isTypeSupported('video/webm; codecs=vp9,opus')
          ? 'video/webm; codecs=vp9,opus'
          : 'video/webm';

        mediaRecorder = new MediaRecorder(combinedStream, {
          mimeType: mime,
          videoBitsPerSecond: 12000000 // 12 Mbps 1080p
        });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          recIndicator.classList.remove('active');
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = 'Lumina_AI_Tanitim_Berkay_Ozdemir.webm';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }, 100);
          statusToast.textContent = '🎉 Video başarıyla oluşturuldu ve indirildi! (Lumina_AI_Tanitim_Berkay_Ozdemir.webm)';
        };

        mediaRecorder.start();
      }

      playCinematicTrailerMusic();
      requestAnimationFrame(loop);
    }

    function loop(now) {
      if (!isPlaying) return;
      const elapsed = (now - startTime) / 1000;

      if (elapsed <= DURATION) {
        renderFrame(elapsed);
        requestAnimationFrame(loop);
      } else {
        renderFrame(DURATION);
        isPlaying = false;
        if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        startOverlay.classList.remove('hidden');
        if (!isRecording) statusToast.textContent = 'Tanıtım videosu tamamlandı. "Videoyu Render Et & İndir" ile dosyayı kaydedebilirsiniz!';
      }
    }

    // Event Listeners
    startOverlay.addEventListener('click', () => startVideo(false));
    btnReplay.addEventListener('click', () => startVideo(false));
    btnRecordDownload.addEventListener('click', () => startVideo(true));

    // Initial first frame render
    logoImg.onload = () => renderFrame(4.5);
    renderFrame(4.5);
  </script>
</body>
